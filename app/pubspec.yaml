name: notemind
description: "NoteMind: local AI study notes with evidence-based answers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.3
  supabase_flutter: ^2.18.0
  http: ^1.6.0
  file_picker: ^13.1.0
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  flutter_secure_storage: ^11.2.0
  pdfrx: ^2.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter


flutter:

  uses-material-design: true




